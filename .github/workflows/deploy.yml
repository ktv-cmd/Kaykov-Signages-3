name: Deploy to SiteGround

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME || vars.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD || vars.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
          local-dir: ./out/
          server-dir: ${{ secrets.SFTP_REMOTE_PATH || vars.SFTP_REMOTE_PATH }}
          dangerous-clean-slate: true
